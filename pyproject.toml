[project]
name = "ltv-decision-layer"
version = "0.1.0"
description = "pLTV decision layer for value-based bidding: send, wait, shrink or block per customer"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "duckdb>=2.0.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pymc-marketing>=1.3.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
